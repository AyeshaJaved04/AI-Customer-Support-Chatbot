<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support — Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .user-info {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .quick-actions {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .quick-btn {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 8px;
            text-align: left;
        }

        .quick-btn:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .sidebar-footer {
            margin-top: auto;
        }

        .btn-logout {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .main {
            margin-left: 280px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 32px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .message-avatar.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        .message-avatar.assistant {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .message-content {
            flex: 1;
        }

        .message-text {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .message.user .message-text {
            background: var(--bg-glass);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .message-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            color: var(--text-tertiary);
            padding: 0 4px;
        }

        .sentiment-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sentiment-positive { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .sentiment-negative { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .sentiment-urgent { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

        .chat-input-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 8px;
            transition: border-color 0.2s ease;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 10px;
            outline: none;
        }

        .btn-send {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-send:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-send:disabled {
            background: var(--bg-tertiary);
            color: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
        }

        .auth-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }

        .auth-logo-text {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: var(--bg-tertiary);
            padding: 4px;
            border-radius: 10px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-tertiary);
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .form-helper {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .main {
                margin-left: 0;
            }
            .chat-container {
                padding: 16px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">🤖</div>
                <div class="auth-logo-text">AI Support</div>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="authError" class="error-message hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" value="testuser1@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="loginPassword" value="testpass123" required style="padding-right: 45px;">
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <div class="form-helper">Test account: testuser1@example.com / testpass123</div>
            </form>

            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="registerName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="registerPassword" required style="padding-right: 45px;">
                        <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">👁️</button>
                    </div>
                    <div class="form-helper">Minimum 8 characters</div>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🤖</div>
                <div class="logo-text">AI Support</div>
            </div>

            <div class="user-info">
                <div class="user-name" id="userName">User</div>
                <div class="user-email" id="userEmail">user@example.com</div>
            </div>

            <div class="quick-actions">
                <div class="section-title">Quick Messages</div>
                <button class="quick-btn" onclick="sendQuickMessage('Where is my order?')">Where is my order?</button>
                <button class="quick-btn" onclick="sendQuickMessage('I want a refund')">I want a refund</button>
                <button class="quick-btn" onclick="sendQuickMessage('How do I return a product?')">How do I return?</button>
                <button class="quick-btn" onclick="sendQuickMessage('URGENT: Product broken!')">URGENT: Product broken!</button>
                <button class="quick-btn" onclick="sendQuickMessage('What payment methods do you accept?')">Payment methods?</button>
            </div>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div class="main">
            <div class="header">
                <div class="header-title">💬 Customer Support Chat</div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message">
                        <div class="message-avatar assistant">🤖</div>
                        <div class="message-content">
                            <div class="message-text">
                                Hello! I'm your AI support assistant. How can I help you today?
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Type your message..." 
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let token = null;
        let userId = null;

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.auth-tab');
            
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
            hideError();
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    userId = 1;
                    document.getElementById('userName').textContent = email.split('@')[0];
                    document.getElementById('userEmail').textContent = email;
                    showMainApp();
                } else {
                    showError('Invalid email or password');
                }
            } catch (error) {
                showError('Connection error. Is the API running?');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, password })
                });
                
                if (response.ok) {
                    switchTab('login');
                    showError('Account created! Please login.', false);
                } else if (response.status === 422) {
                    showError('Invalid input. Check all fields.');
                } else if (response.status === 400) {
                    showError('Email already registered. Please login.');
                } else {
                    showError('Registration failed. Please try again.');
                }
            } catch (error) {
                showError('Connection error. Is the API running?');
            }
        });

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            input.value = '';
            addMessage(message, 'user');
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ user_id: userId, message })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.response, 'assistant', data);
                } else if (response.status === 401) {
                    logout();
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
                }
            } catch (error) {
                addMessage('Connection error. Please check if the API is running.', 'assistant');
            }
            
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }

        function sendQuickMessage(message) {
            document.getElementById('chatInput').value = message;
            sendMessage();
        }

        function addMessage(text, role, data = null) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;
            
            const avatar = role === 'user' ? '👤' : '🤖';
            const avatarClass = role === 'user' ? 'user' : 'assistant';
            
            let metaHTML = '';
            if (data) {
                const sentimentClass = `sentiment-${data.sentiment}`;
                const sentimentEmoji = data.sentiment === 'positive' ? '😊' : 
                                     data.sentiment === 'negative' ? '😟' : 
                                     data.sentiment === 'urgent' ? '🚨' : '😐';
                metaHTML = `
                    <div class="message-meta">
                        <span class="sentiment-badge ${sentimentClass}">
                            ${sentimentEmoji} ${data.sentiment}
                        </span>
                        ${data.sources && data.sources.length > 0 ? 
                            `<span>📚 ${[...new Set(data.sources)].join(', ')}</span>` : ''}
                        ${data.escalated ? '<span style="color: var(--warning)">⚡ Escalated</span>' : ''}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = `
                <div class="message-avatar ${avatarClass}">${avatar}</div>
                <div class="message-content">
                    <div class="message-text">${text}</div>
                    ${metaHTML}
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function showMainApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        function showError(message, isError = true) {
            const errorDiv = document.getElementById('authError');
            errorDiv.textContent = message;
            errorDiv.style.background = isError ? 
                'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
            errorDiv.style.borderColor = isError ? 
                'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)';
            errorDiv.style.color = isError ? 'var(--error)' : 'var(--success)';
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('authError').classList.add('hidden');
        }

        function logout() {
            token = null;
            userId = null;
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('chatMessages').innerHTML = `
                <div class="message">
                    <div class="message-avatar assistant">🤖</div>
                    <div class="message-content">
                        <div class="message-text">
                            Hello! I'm your AI support assistant. How can I help you today?
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
